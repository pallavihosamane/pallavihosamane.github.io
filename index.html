<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pallavi Hosamane | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        /* Navigation */
        nav {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #61dafb;
        }

        /* Hero section */
        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: white;
        }

        .profile {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
            max-width: 600px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #444;
        }

        /* About preview */
        .section {
            padding: 60px 20px;
            text-align: center;
        }

        .section h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .section p {
            max-width: 700px;
            margin: auto;
            line-height: 1.7;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </nav>

    <!-- Main introduction -->
    <section class="hero">

        <img
            class="profile"
            src="profile.jpg"
            alt="Pallavi Hosamane">

        <h1>Hi, I'm Pallavi Hosamane</h1>

        <p>
            Welcome to my personal portfolio website.
            I am interested in technology, programming
            and web development.
        </p>

        <a class="button" href="about.html">
            About Me
        </a>

    </section>

    <!-- Introduction -->
    <section class="section">

        <h2>Welcome</h2>

        <p>
            This website is a place to learn more about me,
            my interests, my skills and my projects.
        </p>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Pallavi Hosamane</p>
    </footer>

</body>

</html>
